<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Webpage</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4f8;
            color: #2d3748;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
            line-height: 1.6;
        }

        h1 {
            color: #2b6cb0;
            text-align: center;
        }

        p {
            font-size: 18px;
            background-color: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        /* Image styling to keep it responsive and centered */
        .featured-image {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 20px auto;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <h1>Not_Void's Class</h1>
    <p>Welcome to our class! In this course, we are learning how to build, style, and host our very own web pages using HTML, CSS, and GitHub Pages.</p>

    <!-- Image Tag with file path, alt text, and CSS class -->
    <img src="my-photo.jpg" alt="A modern setup with laptops and code on screen" class="featured-image">

</body>
</html>
